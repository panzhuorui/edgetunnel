name: Upstream Sync
on:
 # schedule:
 #   - cron: "0 0 * * *" # 每天0点（UTC）同步
  workflow_dispatch: # 允许手动触发
jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v3
      - name: Sync upstream
        uses: ahmadnassri/action-upstream-sync@v2
        with:
          target_branch: main # 您的分支
          upstream_branch: main # 上游分支
          upstream_repo: "cmliu/edgetunnel" # 必须修改
